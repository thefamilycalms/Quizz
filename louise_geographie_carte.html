        /* Navigation fixe à gauche */
        .side-nav {
            position: fixed;
            top: 10px;
            left: 10px;
            display: flex;
            flex-direction: row;
            gap: 10px;
            background-color: #f0f0f0;
            padding: 5px;
            border-radius: 8px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);

}

/* Carte */
.map {
  position: relative;
}
.map img {
  max-width: 500px;
  display: block;
}
.point {
  position: absolute;
  width: 12px;
  height: 12px;
  background-color: red;
  border-radius: 50%;
  cursor: pointer;
  transform: translate(-50%, -50%);
}

/* Quiz à droite */
#quiz {
  width: 250px;
}

button {
  margin-top: 5px;
  display: block;
  width: 100%;
  padding: 5px;
  font-size: 14px;

}

.correct { background-color: #b6e6b6; }

// ======= Affichage d’un point aléatoire =======
function showRandomPoint() {
  const mapDiv = document.querySelector(".map");
  mapDiv.querySelectorAll(".point").forEach(p => p.remove());

  // Choisir un département au hasard
  const index = Math.floor(Math.random() * pointsData.length);
  const dep = pointsData[index];

  // Créer le point
  const point = document.createElement("div");
  point.className = "point";
  point.style.top = dep.y + "%";
  point.style.left = dep.x + "%";
  point.onclick = () => showQuiz(dep);

  mapDiv.appendChild(point);
}

// ======= Affichage du quiz =======
function showQuiz(dep) {
  const optionsDiv = document.getElementById("options");
  optionsDiv.innerHTML = "";

  document.getElementById("questionText").textContent =
    "Quel est ce département ?";

  // Créer 4 propositions aléatoires
  let propositions = [dep.nom];
  while(propositions.length < 5) {
    const randomDep = pointsData[Math.floor(Math.random() * pointsData.length)].nom;
    if(!propositions.includes(randomDep)) propositions.push(randomDep);
  }

  // Mélanger les propositions
  propositions.sort(() => Math.random() - 0.5);

  propositions.forEach(name => {
    const btn = document.createElement("button");
    btn.textContent = name;
btn.onclick = () => {
    if(name === dep.nom){
        btn.classList.add("correct");

        // attendre 0,5 s puis afficher un nouveau point
        setTimeout(() => {
            showRandomPoint();
        }, 500);
    } else {
        btn.classList.add("wrong");
    }
};
    optionsDiv.appendChild(btn);
  });
}

// Afficher un point au chargement
