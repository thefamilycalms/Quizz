}

        /* Navigation fixe à gauche */
        .side-nav {
            position: fixed;
            top: 10px;
            left: 10px;
            display: flex;
            flex-direction: row;
            gap: 10px;
            background-color: #f0f0f0;
            padding: 5px;
            border-radius: 8px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
            font-size: 14px;
            z-index: 1000;
        }


        .side-nav a {
            text-decoration: none;
            color: #333;
            padding: 6px 10px;
            border-radius: 5px;
            background-color: #ddd;
            transition: background-color 0.3s;
        }


        .side-nav a:hover {
            background-color: #bbb;
        }

/* Container carte + quiz */
.container {
  display: flex;
  margin-left: 150px; /* espace pour la barre fixe */
  gap: 50px;
  padding: 20px;
  align-items: flex-start;
}

/* Carte */
.map {
  position: relative;
  width: 500px; /* ou max-width */

}
.map img {
  width: 100%;
  display: block;
}

.point {
  position: absolute;
  width: 14px;
  height: 14px;
  background-color: red;
  border: 2px solid white;
  border-radius: 50%;
  cursor: pointer;
  transform: translate(-50%, -50%);
  z-index: 10;
}

/* Quiz à droite */
#quiz {
  width: 250px;
}

button {
  margin-top: 5px;
  display: block;
  width: 100%;
  padding: 5px;
  font-size: 14px;
  cursor: pointer;
}

.correct { background-color: #b6e6b6; }
.wrong { background-color: #f4b6b6; }

.quit {
  background-color: #eee;
  margin-top: 15px;
}

</style>
</head>

const mapDiv = document.querySelector(".map");
const questionText = document.getElementById("questionText");
const optionsDiv = document.getElementById("options");


// ======= Affichage d’un point aléatoire =======
function showRandomPoint() {
  // Supprime les anciens points
  mapDiv.querySelectorAll(".point").forEach(p => p.remove());

  // Supprime les anciennes options
  optionsDiv.innerHTML = "";

  // Choisir un département aléatoire
  const dep = pointsData[Math.floor(Math.random() * pointsData.length)];
  console.log("Point choisi :", dep);

  // Créer le point
  const point = document.createElement("div");
  point.className = "point";
  point.style.left = dep.x + "%";
  point.style.top = dep.y + "%";

  mapDiv.appendChild(point);

  // Créer les propositions
  let choices = [dep.nom];
  while (choices.length < 4) {
    const random = pointsData[Math.floor(Math.random() * pointsData.length)].nom;
    if (!choices.includes(random)) choices.push(random);
  }

  choices.sort(() => Math.random() - 0.5);

  choices.forEach(name => {
    const btn = document.createElement("button");
    btn.textContent = name;
    btn.onclick = () => {
      if (name === dep.nom) {
        btn.classList.add("correct");
        setTimeout(showRandomPoint, 800);
      } else {
        btn.classList.add("wrong");
      }
    };
    optionsDiv.appendChild(btn);
  });
}
