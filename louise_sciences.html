<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>➕ Français – Louise</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f6ff;
            text-align: center;
            padding: 30px;
        }

        .quiz-box {
            background: white;
            padding: 25px;
            max-width: 600px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        button {
            display: block;
            width: 100%;
            margin: 10px 0;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: none;
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

/* Navigation fixe à gauche */
.side-nav {
    position: fixed;      /* reste fixe quand on scroll */
    top: 50px;            /* décale du haut */
    left: 10px;           /* à gauche */
    display: flex;
    flex-direction: column;
    gap: 10px;            /* espace entre les boutons */
    background-color: #f0f0f0;
    padding: 10px;
    border-radius: 8px;
    box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
    font-size: 14px;      /* plus petit */
    z-index: 1000;        /* toujours au-dessus du contenu */
}

.side-nav a {
    text-decoration: none;
    color: #333;
    padding: 6px 10px;
    border-radius: 5px;
    background-color: #ddd;
    transition: background-color 0.3s;
}

.side-nav a:hover {
    background-color: #bbb;
}




    </style>
</head>
<body>
<!-- Bloc de navigation à gauche -->
<div class="side-nav">
    <a href="index.html">🏠 Accueil</a>
    <a href="Louise.html">⬅ Retour aux thèmes</a>
    <a href="Alice.html">Alice</a>
    <a href="Famille.html">Famille</a>
</div>


    <h1>➕ Français – Louise</h1>

  <!-- Progression texte et barre -->
  <p id="progressionTexte"></p>
  <div style="background:#ddd; border-radius:10px; overflow:hidden;">
      <div id="barre" style="height:15px; width:0%; background:#4CAF50;"></div>
  </div>


    <div class="quiz-box">
        <h2 id="question"></h2>
	<img id="image" style="max-width:100%; display:none; margin:15px 0;">
        <div id="reponses"></div>
    	<p id="feedback" style="font-size:18px; font-weight:bold;"></p>

    <button id="suivant" style="display:none;" onclick="questionSuivante()">    
        ➡️ Question suivante
    </button>

    </div>

<script>
    // 1️⃣ Pool de toutes les questions

const toutesLesQuestions = [

  {"question":"Quelle est la source principale d’énergie de la Terre ?","reponses":["Le Soleil","Le vent","La lune"],"bonneReponse":0},
  {"question":"De quoi les plantes ont-elles besoin pour pousser ?","reponses":["Eau, lumière et terre","Eau seulement","Lumière seulement"],"bonneReponse":0},
  {"question":"Comment s'appelle le gaz que nous respirons ?","reponses":["Oxygène","Dioxyde de carbone","Azote"],"bonneReponse":0},
  {"question":"Quel animal est un mammifère ?","reponses":["Dauphin","Requin","Mésange"],"bonneReponse":0},
  {"question":"Quel est l’état de l’eau quand elle gèle ?","reponses":["Solide","Liquide","Gazeux"],"bonneReponse":0},
  {"question":"Quel organe pompe le sang dans le corps ?","reponses":["Le cœur","Le cerveau","Les poumons"],"bonneReponse":0},
  {"question":"Quelle planète est appelée la planète rouge ?","reponses":["Mars","Jupiter","Venus"],"bonneReponse":0},
  {"question":"Quel sens utilise-t-on pour goûter ?","reponses":["La langue","Le nez","Les yeux"],"bonneReponse":0},
  {"question":"Quel est l’organe principal de la respiration ?","reponses":["Les poumons","Le cœur","Le foie"],"bonneReponse":0},
  {"question":"Comment s’appelle le changement de l’eau en vapeur ?","reponses":["Évaporation","Condensation","Fusion"],"bonneReponse":0},
  {"question":"Quel minéral est important pour les os ?","reponses":["Calcium","Fer","Sodium"],"bonneReponse":0},
  {"question":"Quel animal pond des œufs ?","reponses":["Oiseau","Chien","Chat"],"bonneReponse":0},
  {"question":"Comment s’appelle le moment où la graine devient plante ?","reponses":["Germination","Floraison","Pollinisation"],"bonneReponse":0},
  {"question":"Quel organe permet de voir ?","reponses":["Les yeux","Les oreilles","La bouche"],"bonneReponse":0},
  {"question":"Quel gaz les plantes produisent-elles ?","reponses":["Oxygène","Dioxyde de carbone","Azote"],"bonneReponse":0},
  {"question":"Quel organe filtre le sang ?","reponses":["Les reins","Le cœur","Le poumon"],"bonneReponse":0},
  {"question":"Comment s’appelle le mouvement de la Terre autour du Soleil ?","reponses":["Révolution","Rotation","Translation"],"bonneReponse":0},
  {"question":"Quel sens utilise-t-on pour entendre ?","reponses":["Les oreilles","Le nez","La peau"],"bonneReponse":0},
  {"question":"Quel est l’état de l’eau quand elle bout ?","reponses":["Gazeux","Liquide","Solide"],"bonneReponse":0},
  {"question":"Quel organe sert à digérer les aliments ?","reponses":["L’estomac","Les poumons","Le cœur"],"bonneReponse":0},
  {"question":"Quel animal vit dans l’eau et respire par des branchies ?","reponses":["Poisson","Chat","Chien"],"bonneReponse":0},
  {"question":"Comment s’appelle le cycle de l’eau ?","reponses":["Cycle de l’eau","Cycle de l’air","Cycle du vent"],"bonneReponse":0},
  {"question":"Quel organe contrôle les mouvements et les pensées ?","reponses":["Le cerveau","Le cœur","Les poumons"],"bonneReponse":0},
  {"question":"Quelle planète est la plus proche du Soleil ?","reponses":["Mercure","Mars","Venus"],"bonneReponse":0},
  {"question":"Quelle partie de la plante absorbe l’eau ?","reponses":["Les racines","La tige","Les feuilles"],"bonneReponse":0},
  {"question":"Quel organe produit l’insuline ?","reponses":["Le pancréas","Le foie","Le cœur"],"bonneReponse":0},
  {"question":"Quel est le rôle des feuilles pour la plante ?","reponses":["Photosynthèse","Absorber l’eau","Faire pousser les racines"],"bonneReponse":0},
  {"question":"Quel est l’astre qui éclaire la Terre la nuit ?","reponses":["La Lune","Le Soleil","Mars"],"bonneReponse":0},
  {"question":"Quel animal est un insecte ?","reponses":["Abeille","Chien","Poisson"],"bonneReponse":0},
  {"question":"Comment s’appelle le passage de l’état liquide à l’état solide ?","reponses":["Solidification","Évaporation","Condensation"],"bonneReponse":0},
  {"question":"Quel gaz est essentiel pour la respiration des humains ?","reponses":["Oxygène","Dioxyde de carbone","Azote"],"bonneReponse":0}
];

    // 2️⃣ Tirer 10 questions aléatoires

    function tirer10Questions() {
      const copie = [...toutesLesQuestions];
      for (let i = copie.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copie[i], copie[j]] = [copie[j], copie[i]];
      }
      return copie.slice(0, 10);
    }

    let questions = tirer10Questions();
    let indexQuestion = 0;
    let score = 0;

    // 3️⃣ Afficher la question
    function afficherQuestion() {
      const q = questions[indexQuestion];

      document.getElementById("question").textContent = q.question;
      document.getElementById("progressionTexte").textContent =
        `Question ${indexQuestion + 1} sur ${questions.length}`;
      document.getElementById("feedback").textContent = "";
      document.getElementById("suivant").style.display = "none";

    const zoneReponses = document.getElementById("reponses");
    zoneReponses.innerHTML = "";

    // Mélanger les réponses
    const reponsesMelangees = q.reponses
        .map((rep, index) => ({ texte: rep, indexOriginal: index }))
        .sort(() => Math.random() - 0.5); // tri aléatoire

    reponsesMelangees.forEach(rep => {
        const bouton = document.createElement("button");
        bouton.textContent = rep.texte;
        bouton.onclick = () => verifierReponse(rep.indexOriginal);
        zoneReponses.appendChild(bouton);
    });

      // Barre de progression
      document.getElementById("barre").style.width =
        ((indexQuestion + 1) / questions.length * 100) + "%";
    }

 

    function verifierReponse(indexChoisi) {
      const q = questions[indexQuestion];
      const feedback = document.getElementById("feedback");
      const boutonSuivant = document.getElementById("suivant");

      if (indexChoisi === q.bonneReponse) {
        score++;
        feedback.textContent = "✅ Bonne réponse !";
        feedback.style.color = "green";
      } else {
        feedback.textContent = `❌ Mauvaise réponse. La bonne réponse était : ${q.reponses[q.bonneReponse]}`;
        feedback.style.color = "red";
      }

      document.querySelectorAll("#reponses button").forEach(b => b.disabled = true);
      boutonSuivant.style.display = "block";
    }

    // 5️⃣ Question suivante
function questionSuivante() {
    indexQuestion++;
    if (indexQuestion < questions.length) {
        afficherQuestion();
    } else {
        afficherResultat();
    }
}


    // 6️⃣ Afficher le résultat
    function afficherResultat() {
      const meilleurScore = localStorage.getItem("meilleurScore") || 0;
      if (score > meilleurScore) localStorage.setItem("meilleurScore", score);

      document.querySelector(".quiz-box").innerHTML = `
        <h2>🎉 Fin du quiz !</h2>
        <p>Score : ${score} / ${questions.length}</p>
        <p>Meilleur score : ${Math.max(score, meilleurScore)} / ${questions.length}</p>
        <a href="Louise.html">⬅ Retour aux thèmes</a><br><br>
        <a href="index.html">🏠 Accueil</a><br><br>
        <button id="rejouerBtn">🔄 Rejouer</button>
      `;

      document.getElementById("rejouerBtn").addEventListener("click", rejouerQuiz);
    }

    // 7️⃣ Rejouer
    function rejouerQuiz() {
      indexQuestion = 0;
      score = 0;
      questions = tirer10Questions(); // tirer un nouveau lot
      afficherQuestion();
    }

    // 8️⃣ Initialisation
    afficherQuestion();
  </script>
</body>
</html>
