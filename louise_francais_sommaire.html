<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Français – Louise</title>
<style>
body {
    font-family: Arial, sans-serif;
    background-color: #f2f6ff;
    text-align: center;
    padding: 30px;
}
h1 {
    margin-bottom: 30px;
}

/* Bloc menu */
.menu {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    max-width: 800px;
    margin: auto;
}

.menu button {
    padding: 20px 30px;
    font-size: 16px;
    border-radius: 10px;
    border: none;
    background-color: #4CAF50;
    color: white;
    cursor: pointer;
    flex: 1 1 200px;
    min-width: 150px;
    transition: background-color 0.3s;
}

.menu button:hover {
    background-color: #45a049;
}
</style>
</head>
<body>

<h1>Français – Choisis ton exercice</h1>

<div class="menu">
    <button onclick="ouvrirExercice('quiz')">Quiz</button>
    <button onclick="ouvrirExercice('relier')">Mots à relier</button>
    <button onclick="ouvrirExercice('motscroises')">Mots croisés</button>
    <button onclick="ouvrirExercice('dragdrop')">Drag and Drop</button>
    <button onclick="ouvrirExercice('carte')">Point sur carte</button>
    <button onclick="ouvrirExercice('qcm')">QCM</button>
    <button onclick="ouvrirExercice('fiches')">Fiches mémoire</button>
</div>

<script>
function ouvrirExercice(type) {
    // Ici tu peux soit rediriger vers une page spécifique :
    window.location.href = type + '.html';
    
    // Ou charger dynamiquement le contenu dans la page si tu veux tout en une page.
}
</script>

</body>
</html>
