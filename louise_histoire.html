    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f6ff;
            text-align: center;
            padding: 30px;
        }

        .quiz-box {
            background: white;
            padding: 25px;
            max-width: 600px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        button {
            display: block;
            width: 100%;
            margin: 10px 0;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: none;
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

/* Navigation fixe à gauche */
.side-nav {
    position: fixed;      /* reste fixe quand on scroll */
    top: 50px;            /* décale du haut */
    left: 10px;           /* à gauche */
    display: flex;
    flex-direction: column;
    gap: 10px;            /* espace entre les boutons */
    background-color: #f0f0f0;
    padding: 10px;
    border-radius: 8px;
    box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
    font-size: 14px;      /* plus petit */
    z-index: 1000;        /* toujours au-dessus du contenu */
}

.side-nav a {
    text-decoration: none;
    color: #333;
    padding: 6px 10px;
    border-radius: 5px;
    background-color: #ddd;
    transition: background-color 0.3s;
}

.side-nav a:hover {
    background-color: #bbb;
}




    </style>
</head>
<body>
<!-- Bloc de navigation à gauche -->
<div class="side-nav">

    <h1>➕ Mathématiques – Louise</h1>

  <!-- Progression texte et barre -->
  <p id="progressionTexte"></p>
  <div style="background:#ddd; border-radius:10px; overflow:hidden;">
      <div id="barre" style="height:15px; width:0%; background:#4CAF50;"></div>
  </div>


    <div class="quiz-box">
        <h2 id="question"></h2>
	<img id="image" style="max-width:100%; display:none; margin:15px 0;">
        <div id="reponses"></div>
    	<p id="feedback" style="font-size:18px; font-weight:bold;"></p>

    <button id="suivant" style="display:none;" onclick="questionSuivante()">    
        ➡️ Question suivante
    </button>

    </div>

<script>
    // 1️⃣ Pool de toutes les questions

const toutesLesQuestions = [

  {"question":"Qui était Charlemagne ?","reponses":["Un roi des Francs","Un empereur romain","Un explorateur","Charlemagne n'a jamais existé"],"bonneReponse":0},
  {"question":"Quand a eu lieu la Révolution française ?","reponses":["1789","1492","1815"],"bonneReponse":0},
  {"question":"Quel monument a été construit par les Romains ?","reponses":["Le Colisée","La Tour Eiffel","Le château de Versailles"],"bonneReponse":0},
  {"question":"Qui a découvert l’Amérique en 1492 ?","reponses":["Christophe Colomb","Marco Polo","Napoléon"],"bonneReponse":0},
  {"question":"Quel est le nom de la première reine de France couronnée à Reims ?","reponses":["Clotilde","Marie-Antoinette","Élisabeth Ire"],"bonneReponse":0},
  {"question":"Qu’est-ce que le Moyen Âge ?","reponses":["Une période entre Antiquité et Temps modernes","Une période de l’histoire de la Chine","Une période après la Révolution française"],"bonneReponse":0},
  {"question":"Qu’est-ce que la Bastille ?","reponses":["Une prison à Paris","Un château en Normandie","Un bateau de Louis XIV"],"bonneReponse":0},
  {"question":"Qui était Jeanne d’Arc ?","reponses":["Une héroïne française","Une reine d’Angleterre","Une peintre célèbre"],"bonneReponse":0},
  {"question":"Quel roi a construit Versailles ?","reponses":["Louis XIV","Louis XVI","Henri IV"],"bonneReponse":0},
  {"question":"Qu’est-ce que le serf ?","reponses":["Un paysan attaché à la terre","Un chevalier du Moyen Âge","Un artisan de ville"],"bonneReponse":0},
  {"question":"Qui était Napoléon Bonaparte ?","reponses":["Un empereur français","Un roi de Prusse","Un général romain"],"bonneReponse":0},
  {"question":"Quel événement marque le début de la Révolution française ?","reponses":["La prise de la Bastille","La mort de Charlemagne","Le couronnement de Louis XIV"],"bonneReponse":0},
  {"question":"Qu’est-ce qu’un château fort ?","reponses":["Une forteresse médiévale","Une maison de campagne","Un palais royal moderne"],"bonneReponse":0},
  {"question":"Qu’est-ce que les croisades ?","reponses":["Des expéditions religieuses au Moyen Âge","Des batailles de la Révolution","Des voyages scientifiques"],"bonneReponse":0},
  {"question":"Qui étaient les Gaulois ?","reponses":["Peuple vivant en France avant les Romains","Explorateurs du Moyen Âge","Rois de la Renaissance"],"bonneReponse":0},
  {"question":"Qui a inventé l’imprimerie ?","reponses":["Gutenberg","Louis Pasteur","Leonardo da Vinci"],"bonneReponse":0},
  {"question":"Quelle invention a permis de voyager plus vite au 15e siècle ?","reponses":["La caravelle","La bicyclette","La voiture à vapeur"],"bonneReponse":0},
  {"question":"Qu’est-ce que la féodalité ?","reponses":["Organisation de la société au Moyen Âge","Un type de château","Un costume royal"],"bonneReponse":0},
  {"question":"Quel roi était surnommé 'le Roi Soleil' ?","reponses":["Louis XIV","Louis XVI","Charles de Gaulle"],"bonneReponse":0},
  {"question":"Que célébre-t-on le 14 juillet ?","reponses":["La fête nationale","La Révolution industrielle","La fin de la guerre de Cent Ans"],"bonneReponse":0},
  {"question":"Quel peuple a construit les aqueducs ?","reponses":["Les Romains","Les Gaulois","Les Vikings"],"bonneReponse":0},
  {"question":"Que sont les Vikings ?","reponses":["Des navigateurs du Nord de l’Europe","Des philosophes grecs","Des rois de France"],"bonneReponse":0},
  {"question":"Qu’est-ce que la Renaissance ?","reponses":["Une période de renouveau artistique et scientifique","Une guerre au Moyen Âge","Une fête religieuse"],"bonneReponse":0},
  {"question":"Quel est le rôle d’un chevalier ?","reponses":["Protéger son seigneur et son territoire","Faire des expériences scientifiques","Peindre des tableaux"],"bonneReponse":0},
  {"question":"Qu’est-ce que la révolution industrielle ?","reponses":["Le passage aux machines et usines","La construction des châteaux forts","La découverte de l’Amérique"],"bonneReponse":0},
  {"question":"Qui était Louis XVI ?","reponses":["Le roi de France guillotiné en 1793","Un empereur romain","Un roi d’Angleterre"],"bonneReponse":0},
  {"question":"Que fait-on à la guillotine ?","reponses":["Exécuter quelqu’un pendant la Révolution","Construire un château","Peindre un tableau"],"bonneReponse":0},
  {"question":"Qu’est-ce que l’esclavage ?","reponses":["Pratique qui consistait à priver des personnes de liberté","Un type de château","Une fête religieuse"],"bonneReponse":0},
  {"question":"Que symbolise la Marianne ?","reponses":["La République française","Une reine de France","Une ville de l’Antiquité"],"bonneReponse":0}
];

    // 2️⃣ Tirer 10 questions aléatoires

    function tirer10Questions() {
      const copie = [...toutesLesQuestions];
      for (let i = copie.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copie[i], copie[j]] = [copie[j], copie[i]];
      }
      return copie.slice(0, 10);
    }

    let questions = tirer10Questions();
    let indexQuestion = 0;
    let score = 0;

    // 3️⃣ Afficher la question
    function afficherQuestion() {
      const q = questions[indexQuestion];

      document.getElementById("question").textContent = q.question;
      document.getElementById("progressionTexte").textContent =
        `Question ${indexQuestion + 1} sur ${questions.length}`;
      document.getElementById("feedback").textContent = "";
      document.getElementById("suivant").style.display = "none";

    const zoneReponses = document.getElementById("reponses");
    zoneReponses.innerHTML = "";

    // Mélanger les réponses
    const reponsesMelangees = q.reponses
        .map((rep, index) => ({ texte: rep, indexOriginal: index }))
        .sort(() => Math.random() - 0.5); // tri aléatoire

    reponsesMelangees.forEach(rep => {
        const bouton = document.createElement("button");
        bouton.textContent = rep.texte;
        bouton.onclick = () => verifierReponse(rep.indexOriginal);
        zoneReponses.appendChild(bouton);
    });

      // Barre de progression
      document.getElementById("barre").style.width =
        ((indexQuestion + 1) / questions.length * 100) + "%";
    }

 

    function verifierReponse(indexChoisi) {
      const q = questions[indexQuestion];
      const feedback = document.getElementById("feedback");
      const boutonSuivant = document.getElementById("suivant");

      if (indexChoisi === q.bonneReponse) {
        score++;
        feedback.textContent = "✅ Bonne réponse !";
        feedback.style.color = "green";
      } else {
        feedback.textContent = `❌ Mauvaise réponse. La bonne réponse était : ${q.reponses[q.bonneReponse]}`;
        feedback.style.color = "red";
      }

      document.querySelectorAll("#reponses button").forEach(b => b.disabled = true);
      boutonSuivant.style.display = "block";
    }

    // 5️⃣ Question suivante
function questionSuivante() {
    indexQuestion++;
    if (indexQuestion < questions.length) {
        afficherQuestion();
    } else {
        afficherResultat();
    }
}


    // 6️⃣ Afficher le résultat
    function afficherResultat() {
      const meilleurScore = localStorage.getItem("meilleurScore") || 0;
      if (score > meilleurScore) localStorage.setItem("meilleurScore", score);

      document.querySelector(".quiz-box").innerHTML = `
        <h2>🎉 Fin du quiz !</h2>
        <p>Score : ${score} / ${questions.length}</p>
        <p>Meilleur score : ${Math.max(score, meilleurScore)} / ${questions.length}</p>
        <a href="Louise.html">⬅ Retour aux thèmes</a><br><br>
        <a href="index.html">🏠 Accueil</a><br><br>
        <button id="rejouerBtn">🔄 Rejouer</button>
      `;

      document.getElementById("rejouerBtn").addEventListener("click", rejouerQuiz);
    }

    // 7️⃣ Rejouer
    function rejouerQuiz() {
      indexQuestion = 0;
      score = 0;
      questions = tirer10Questions(); // tirer un nouveau lot
      afficherQuestion();
    }

    // 8️⃣ Initialisation
    afficherQuestion();
  </script>
</body>
</html>
