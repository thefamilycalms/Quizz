<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Alice niveau CP</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e8f5e9;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        /* Navigation fixe à gauche */
        .side-nav {
            position: fixed;
            top: 10px;
            left: 10px;
            display: flex;
            flex-direction: gap;
            gap: 10px;
            background-color: #f0f0f0;
            padding: 5px;
            border-radius: 8px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
            font-size: 14px;
            z-index: 1000;
        }


        .side-nav a {
            text-decoration: none;
            color: #333;
            padding: 6px 10px;
            border-radius: 5px;
            background-color: #ddd;
            transition: background-color 0.3s;
        }


        .side-nav a:hover {
            background-color: #bbb;
        }

        /* Menu principal */
        .menu-container {
            text-align: center;
            max-width: 800px; /* Plus large pour 3 colonnes */
            width: 100%;
        }

        h1 {
            margin-bottom: 20px;
        }

        .menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;

        }

        .menu a {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-color: #4CAF50;
            color: white;
            font-size: 18px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-decoration: none;
            transition: transform 0.2s, background-color 0.2s;

        }

        .menu a span {
            margin-left: 10px;
        }

        .menu a:hover {
            background-color: #45a049;
            transform: translateY(-3px);
        }
    </style>
</head>
