<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>➕ Mathématiques – Louise</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f6ff;
            text-align: center;
            padding: 30px;
        }

        .quiz-box {
            background: white;
            padding: 25px;
            max-width: 600px;
 	    margin: 10px auto 0 auto;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        button {
            display: block;
            width: 100%;
            margin: 10px 0;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: none;
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        /* Navigation fixe à gauche */
        .side-nav {
            position: fixed;
            top: 10px;
            left: 10px;
            display: flex;
            flex-direction: gap;
            gap: 10px;
            background-color: #f0f0f0;
            padding: 5px;
            border-radius: 8px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
            font-size: 14px;
            z-index: 1000;
        }

.side-nav a {
    text-decoration: none;
    color: #333;
    padding: 6px 10px;
    border-radius: 5px;
    background-color: #ddd;
    transition: background-color 0.3s;
}

.side-nav a:hover {
    background-color: #bbb;
}

/* Barre de progression */
#progressContainer {
    background: #ddd;
    border-radius: 10px;
    overflow: hidden;
    width: 80%;
    margin: 20px auto;
    height: 15px;
}

#barre {
    height: 100%;
    width: 0%;
    background: #4CAF50;
}

/* Chronomètre */
#chrono {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 15px;
}

/* Feedback */
#feedback {
    font-size: 18px;
    font-weight: bold;
    margin-top: 10px;
}

    </style>
</head>
<body>

<div class="side-nav">

<div id="resultats" style="display:none;"></div>

{ question: "8 + 2 = ?", reponses: ["10","9","8"], bonneReponse: 0 }
];

let questions = [...toutesLesQuestions].sort(()=>Math.random()-0.5).slice(0,10);
let indexQuestion = 0;
let chrono = 0;
let intervalChrono;

// ====== CHRONO ======
function demarrerChrono() {
    intervalChrono = setInterval(() => {
        chrono++;
        document.getElementById("chrono").textContent = `⏱️ Temps : ${chrono}s`;
    }, 1000);
}

    // 2️⃣ Tirer 10 questions aléatoires


    // 3️⃣ Afficher la question
function afficherQuestion() {
    const q = questions[indexQuestion];
    document.getElementById("question").textContent = q.question;
    document.getElementById("progressionTexte").textContent = `Question ${indexQuestion+1} sur ${questions.length}`;
    document.getElementById("feedback").textContent = "";

  const zone = document.getElementById("reponses");
    zone.innerHTML = "";

    // Mélanger les réponses
    const reponsesMelangees = q.reponses.map((rep,i)=>({texte:rep,indexOriginal:i})).sort(()=>Math.random()-0.5);
    reponsesMelangees.forEach(rep => {
        const bouton = document.createElement("button");
        bouton.textContent = rep.texte;
        bouton.onclick = () => verifierReponse(rep.indexOriginal, bouton);
        zone.appendChild(bouton);
    });

      // Barre de progression
      document.getElementById("barre").style.width =
        ((indexQuestion + 1) / questions.length * 100) + "%";
    }

 

function verifierReponse(indexChoisi, boutonClique){
    const q = questions[indexQuestion];
    const feedback = document.getElementById("feedback");

      if (indexChoisi === q.bonneReponse) {
        feedback.textContent = "✅ Bonne réponse !";
        feedback.style.color = "green";
        // Désactiver toutes les réponses
        document.querySelectorAll("#reponses button").forEach(b=>b.disabled=true);
        // Passage automatique 1s
        setTimeout(()=>{ indexQuestion++; questionSuivante(); }, 1000);
    } else {
        feedback.textContent = "❌ Mauvaise réponse. Essaie encore !";
        feedback.style.color = "red";
        boutonClique.style.backgroundColor = "#e74c3c";
        boutonClique.disabled = true;
    }
}



    // 5️⃣ Question suivante
function questionSuivante() {
    if (indexQuestion < questions.length) {
        afficherQuestion();
    } else {
        finQuiz();
    }
}

// ====== FIN DU QUIZ ======
function finQuiz(){
    clearInterval(intervalChrono);

    // Récupérer meilleurs temps
    let meilleursTemps = JSON.parse(localStorage.getItem("meilleursTemps")) || [];
    const dateActuelle = new Date().toLocaleDateString();

    meilleursTemps.push({temps: chrono, date: dateActuelle});
    meilleursTemps.sort((a,b)=>a.temps-b.temps);
    if(meilleursTemps.length>10) meilleursTemps=meilleursTemps.slice(0,10);
    localStorage.setItem("meilleursTemps", JSON.stringify(meilleursTemps));

    const listeTemps = meilleursTemps.map(t=>`<li>${t.temps}s - ${t.date}</li>`).join("");

    // Masquer le quiz et afficher les résultats
    document.getElementById("quizBox").style.display = "none";
    document.getElementById("resultats").style.display = "block";
    document.getElementById("resultats").innerHTML = `
        <h2>🎉 Fin du quiz !</h2>
        <p>⏱️ Temps total : ${chrono}s</p>
        <h3>🏆 Meilleurs temps :</h3>
        <ol style="text-align:left">${listeTemps}</ol>
        <button onclick="rejouerQuiz()">🔄 Rejouer</button>
    `;
}

    // 6️⃣ Afficher le résultat


    // 7️⃣ Rejouer
function rejouerQuiz(){
    indexQuestion = 0;
    chrono = 0;
    questions = [...toutesLesQuestions].sort(() => Math.random()-0.5).slice(0,10);

    // Masquer les résultats et réafficher le quiz
    document.getElementById("resultats").style.display = "none";
    document.getElementById("quizBox").style.display = "block";
  
  demarrerChrono();
    afficherQuestion();
}

    // 8️⃣ Initialisation
demarrerChrono();
afficherQuestion();
